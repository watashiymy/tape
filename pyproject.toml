[project]
name = "quant-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0,<4",
    "pyarrow>=15",
    "baostock>=0.8.8",
    "PyYAML>=6",
    "plotly>=5.20",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = ["network: 需要联网访问 baostock 的集成测试"]
