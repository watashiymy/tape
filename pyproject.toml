[project]
name = "quant-demo"
version = "0.5.0"
requires-python = ">=3.12"
# 下界一律只承诺**实测跑过**的那一档，上界一律给到下一个大版本：
# baostock 0.9.3 的 get_data() 就因为上游 pandas 删掉 DataFrame.append 而炸过一次
# （README §8 记着），"装得上、跑起来才崩"是本项目最讨厌的失败形态。
dependencies = [
    "pandas>=3.0,<4",
    "pyarrow>=15,<21",
    "baostock>=0.8.8,<1",
    "PyYAML>=6,<7",
    "plotly>=5.20,<7",
    # 1.61 而不是 1.30：st.navigation / st.Page / st.logo / st.iframe /
    # ButtonColumn / width="stretch" 都晚于 1.30，写 1.30 是让人装上一个必崩的组合。
    "streamlit>=1.61,<2",
]

[project.optional-dependencies]
# openpyxl 是「记账」页导出 Excel 的后端。它不在主依赖里（CSV 导出不需要它），
# 但**必须**在 dev 里：少了它 tests/test_journal_export.py 等 8 项直接红。
excel = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8", "openpyxl>=3.1,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' --strict-markers"
markers = ["network: 需要联网访问 baostock 的集成测试"]
