universe: ["600519", "600036", "601318", "600900", "000333",
           "600030", "600276", "601088", "600887", "601899"]
benchmark: "000300"
backtest:
  start: "2016-01-01"
  capital: 5000000
costs:
  commission_rate: 0.00025
  commission_min: 5.0
  stamp_tax:                       # 仅卖出，按成交日分段（spec 决策5）
    - {until: "2023-08-27", rate: 0.001}
    - {from: "2023-08-28", rate: 0.0005}
  slippage: 0.001
strategies:
  ma_cross: {fast: 20, slow: 60}
  donchian: {entry_n: 20, exit_n: 10, amount_n: 20, amount_ratio: 1.5}
overlays:                          # 叠加层：对全部策略生效（v0.4.0；无此段 = 全部禁用）
  # ATR 追踪止损：adj_close < 入场以来最高 adj_close − k×ATR(n) 即 T+1 开盘离场；
  # k=3 而非海龟经典的 2——实测证明"出场太急、一次正常回调就被甩下车"是唐奇安跑输主因
  atr_stop: {enabled: true, n: 20, k: 3.0}
scan:                              # 全市场扫描（v0.1.1）
  history_days: 400                # 拉取历史窗口（自然日），约 270 根 K 线 > MA60 两倍
  min_avg_amount: 50000000         # 20 日均成交额门槛（元）：流动性差的票信号无意义且滑点假设失效
  top_n: 20                        # 终端打印条数（CSV 存全量）
