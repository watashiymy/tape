# quant_demo 面板主题（v0.2.1 设计 §2.1）——调性："金融电报"（旧交易所报价板）。
#
# 基础配色**必须**放在这里，不许改用 CSS 注入：Streamlit 的内部 class 名
# （.st-emotion-cache-xxxx）每个版本都变，靠它做样式的面板下次 pip install -U 就静默失效。
# config.toml 是官方支持面。CSS（app/theme.py）只补 config.toml 表达不了的排版层级，
# 且只选我们自己包出来的 .qd-* 容器。
#
# 这四个色值与 app/theme.py 的常量由 tests/test_theme.py 钉住一致（此处不能 import Python）。
[theme]
base = "dark"
primaryColor = "#C8963E"              # 琥珀金：主按钮、选中态、强调。只给可操作元素
backgroundColor = "#12141A"           # 近黑石板，非纯黑（纯黑对比过硬伤眼）
secondaryBackgroundColor = "#1A1D26"  # 卡片/输入框/代码块，与底色只差一档
textColor = "#E8E4DC"                 # 暖白，非纯白

# —— 全局主题（2026-11-16）——
#
# 上面四色只管住了底色与强调色；按钮、输入框、表格、折叠区、侧栏这些**原生控件**一直是
# streamlit 出厂的长相（大圆角、Source Sans、亮红亮绿蓝的提示色），与我们自己包的 .qd-*
# （发丝线、衬线标题、等宽数字）是两套东西。下面这些项把原生控件拉到同一套语言上。
# 仍然只走本文件——用 CSS 改原生控件就得选内部 class，升级必挂（见文件开头）。
#
# 每个色值都抄自 quant.report.palette、三套字体栈抄自 app/theme.py（单引号写法），
# 由 tests/test_theme.py 逐项比对：这里不许出现色板之外的颜色。
font = "'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif"   # 正文与控件：同 theme.SANS
headingFont = "'Songti SC', STSong, 'Noto Serif SC', serif"            # 标题：同 theme.SERIF
codeFont = "'IBM Plex Mono', Menlo, 'SF Mono', monospace"              # 日志与代码：同 theme.MONO
baseRadius = "0.25rem"                # 小圆角：与 .qd-pill 的 2px 是一家，出厂的 0.5rem 太圆
buttonRadius = "0.25rem"
borderColor = "#2A2E38"               # 发丝线（palette.HAIRLINE）：卡片、折叠区、按钮描边
showWidgetBorder = true               # 输入框也描一圈发丝线，否则在暗底上只剩一块色
showSidebarBorder = true
linkColor = "#C8963E"                 # 链接是可操作元素 → 琥珀金；出厂是蓝，色板里没有蓝
linkUnderline = false
codeBackgroundColor = "#1A1D26"       # 日志框底色 = SURFACE
codeTextColor = "#E8E4DC"             # 行内代码出厂是绿字，而绿在这里专指「跌」→ 用正文色
dataframeBorderColor = "#2A2E38"
dataframeHeaderBackgroundColor = "#1A1D26"
# 提示框 / 徽标的内置色全部改指色板：红 = 失败 / 涨，绿 = 成功 / 跌（与状态 pill 同一对），
# 警告用琥珀，st.info 用中性灰。警告框是"琥珀只给可操作元素"的唯一例外：它出厂就是黄色，
# 改指琥珀只是让它落在色板里。提示框实际的字色与底色由 streamlit 从这几个基色派生（字更亮、底是 20% 透明度）。
redColor = "#D94A4A"
greenColor = "#3E9E7A"
orangeColor = "#C8963E"
yellowColor = "#C8963E"
blueColor = "#8C8778"
grayColor = "#8C8778"

[theme.sidebar]
backgroundColor = "#0E1015"           # 比页面深一档（palette.SIDEBAR）：导航退后，内容区是主角
borderColor = "#2A2E38"

# —— 以下两条是**安全与隐私默认**（v0.5.0），不是主题设置 ——
#
# 注意边界：streamlit 按**当前工作目录**查找 $CWD/.streamlit/config.toml。
# 也就是说这两条只在「项目根目录下启动」时生效；从别的目录起会静默退回出厂默认。
# 所以它们是"少打一个参数也安全"的兜底，不是可以不看 README 安全提示的理由。
[server]
# 出厂默认监听 *:8501（所有网卡）。而本面板能在本机执行脚本 —— 暴露到局域网
# 等同于把远程命令执行接口挂出去。这里把回环绑定从「文档纪律」变成默认值。
# 命令行的 --server.address 优先级更高，仍可覆盖。
address = "127.0.0.1"

[browser]
# 出厂默认 true，会向 streamlit 上报使用统计。这台机器上同时存着真实成交记录，
# 关掉它没有任何代价。
gatherUsageStats = false

[client]
# 关掉「开发者选项」：右上角的 Deploy 按钮、菜单里的 Rerun / Clear cache，
# **以及键盘热键 `c`（弹 Clear cache 对话框）**。
#
# 这才是 Cmd+C 复制文字会弹 "Clear cache?" 的真正修法。1.61 的前端把 `c` 键交给
# App.handleKeyDown 自己 switch，**根本不经过 hotkeys-js**（window.hotkeys 存在但
# _handlers 为空），所以 v0.2.2 那段包 hotkeys.filter 的注入脚本从头到尾是空操作。
# 而 handleKeyDown 里 `case 'c'` 被 sT(isOwner, toolbarMode) 守着——viewer 模式下
# 它恒为 false，热键与菜单项一并消失。
#
# 代价：Rerun 菜单项与 Deploy 按钮也没了。前者本项目用不上（改代码 streamlit 会自己
# 重跑；面板任务有自己的按钮），后者从来没人点过。
toolbarMode = "viewer"
