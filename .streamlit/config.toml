# quant_demo 面板主题（v0.2.1 设计 §2.1）——调性："金融电报"（旧交易所报价板）。
#
# 基础配色**必须**放在这里，不许改用 CSS 注入：Streamlit 的内部 class 名
# （.st-emotion-cache-xxxx）每个版本都变，靠它做样式的面板下次 pip install -U 就静默失效。
# config.toml 是官方支持面。CSS（app/theme.py）只补 config.toml 表达不了的排版层级，
# 且只选我们自己包出来的 .qd-* 容器。
#
# 这四个色值与 app/theme.py 的常量由 tests/test_theme.py 钉住一致（此处不能 import Python）。
[theme]
base = "dark"
primaryColor = "#C8963E"              # 琥珀金：主按钮、选中态、强调。只给可操作元素
backgroundColor = "#12141A"           # 近黑石板，非纯黑（纯黑对比过硬伤眼）
secondaryBackgroundColor = "#1A1D26"  # 卡片/侧栏，与底色只差一档
textColor = "#E8E4DC"                 # 暖白，非纯白

# —— 以下两条是**安全与隐私默认**（v0.5.0），不是主题设置 ——
#
# 注意边界：streamlit 按**当前工作目录**查找 $CWD/.streamlit/config.toml。
# 也就是说这两条只在「项目根目录下启动」时生效；从别的目录起会静默退回出厂默认。
# 所以它们是"少打一个参数也安全"的兜底，不是可以不看 README 安全提示的理由。
[server]
# 出厂默认监听 *:8501（所有网卡）。而本面板能在本机执行脚本 —— 暴露到局域网
# 等同于把远程命令执行接口挂出去。这里把回环绑定从「文档纪律」变成默认值。
# 命令行的 --server.address 优先级更高，仍可覆盖。
address = "127.0.0.1"

[browser]
# 出厂默认 true，会向 streamlit 上报使用统计。这台机器上同时存着真实成交记录，
# 关掉它没有任何代价。
gatherUsageStats = false

[client]
# 关掉「开发者选项」：右上角的 Deploy 按钮、菜单里的 Rerun / Clear cache，
# **以及键盘热键 `c`（弹 Clear cache 对话框）**。
#
# 这才是 Cmd+C 复制文字会弹 "Clear cache?" 的真正修法。1.61 的前端把 `c` 键交给
# App.handleKeyDown 自己 switch，**根本不经过 hotkeys-js**（window.hotkeys 存在但
# _handlers 为空），所以 v0.2.2 那段包 hotkeys.filter 的注入脚本从头到尾是空操作。
# 而 handleKeyDown 里 `case 'c'` 被 sT(isOwner, toolbarMode) 守着——viewer 模式下
# 它恒为 false，热键与菜单项一并消失。
#
# 代价：Rerun 菜单项与 Deploy 按钮也没了。前者本项目用不上（改代码 streamlit 会自己
# 重跑；面板任务有自己的按钮），后者从来没人点过。
toolbarMode = "viewer"
